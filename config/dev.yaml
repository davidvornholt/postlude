# Shared non-secret development configuration, keyed like secrets/dev.yaml
# (apps.<name>, packages.<name>). `just dev-env-generate` composes each
# workspace's .env.local from the three dev layers and any authorized
# broker-owned S3 pairs referenced by a plain layer. The local layer overrides
# the shared layers. A key never lives in both this file and secrets/dev.yaml.
# This file is seeded once and then owned by your repo.
#
# GITHUB_CLIENT_ID belongs to the "Postlude (dev)" GitHub OAuth app, whose
# callback is http://localhost:3000/api/auth/callback/github. That callback is
# why BETTER_AUTH_URL and the dev server both have to stay on port 3000. Its
# client secret is a secret and lives in secrets/dev.yaml.
apps:
  web:
    DATABASE_URL: &databaseUrl postgresql://postlude:postlude@127.0.0.1:15433/postlude_dev
    BETTER_AUTH_URL: http://localhost:3000
    GITHUB_CLIENT_ID: Ov23liMZSmT9ereDMgRP
    GITHUB_ALLOWED_ACCOUNT_ID: "157214705"
    # Which clock decides the journal day. A journal day runs 04:00-04:00 in
    # this zone, on every device, so a late-night entry belongs to the evening
    # it closes out wherever it was written.
    JOURNAL_TIME_ZONE: Europe/Berlin
    # Isolated private development storage. EU endpoint and bucket have no defaults.
    # All four R2 values are needed for images; absent values leave text journaling available.
    R2_ENDPOINT: https://831f91724ea62b0cb0215829eb001f66.eu.r2.cloudflarestorage.com
    R2_BUCKET: postlude-images-dev
    R2_ACCESS_KEY_ID:
      brokeredS3: assets
      key: assets.images_rw
      part: access_key_id
    R2_SECRET_ACCESS_KEY:
      brokeredS3: assets
      key: assets.images_rw
      part: secret_access_key
packages:
  db:
    # The app and the migration tooling share one local database.
    DATABASE_URL: *databaseUrl
